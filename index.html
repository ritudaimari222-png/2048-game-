<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>2048</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#faf8ef;color:#776e65;display:flex;justify-content:center}
.app{width:min(94vw,480px);padding:24px 0}.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:64px;margin:0;font-weight:800}.scores{display:flex;gap:8px}.score{background:#bbada0;color:white;padding:8px 16px;border-radius:5px;text-align:center;font-weight:700;min-width:75px}.score small{display:block;font-size:11px}.score b{font-size:20px}
.row{display:flex;justify-content:space-between;align-items:center;margin:10px 0 16px}.hint{font-size:14px;line-height:1.3}.btn{border:0;background:#8f7a66;color:#fff;padding:10px 14px;border-radius:5px;font-weight:bold;font-size:14px}
.board{position:relative;background:#bbada0;border-radius:7px;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;touch-action:none;user-select:none}
.cell{aspect-ratio:1;background:#cdc1b4;border-radius:5px}.tile{aspect-ratio:1;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,8vw,38px);font-weight:800;position:relative}
.t2{background:#eee4da}.t4{background:#ede0c8}.t8{background:#f2b179;color:#fff}.t16{background:#f59563;color:#fff}.t32{background:#f67c5f;color:#fff}.t64{background:#f65e3b;color:#fff}.t128{background:#edcf72;color:#fff;font-size:32px}.t256{background:#edcc61;color:#fff;font-size:32px}.t512{background:#edc850;color:#fff;font-size:32px}.t1024,.t2048{background:#edc53f;color:#fff;font-size:27px}
.overlay{position:absolute;inset:0;background:rgba(238,228,218,.78);display:none;align-items:center;justify-content:center;flex-direction:column;border-radius:7px}.overlay.show{display:flex}.overlay h2{font-size:42px;margin:0 0 12px}
p{font-size:13px}.footer{text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1>2048</h1><div class="scores"><div class="score"><small>SCORE</small><b id="score">0</b></div><div class="score"><small>BEST</small><b id="best">0</b></div></div></div>
  <div class="row"><div class="hint"><b>Join the numbers and get to 2048!</b><br>Use arrow keys or swipe.</div><button class="btn" id="new">New Game</button></div>
  <div class="board" id="board"></div>
  <div class="footer">Made as a 2048 game prototype</div>
</div>
<script>
const board=document.getElementById('board'), scoreEl=document.getElementById('score'), bestEl=document.getElementById('best');
let grid,score,best=Number(localStorage.best2048||0),won=false,over=false;
bestEl.textContent=best;
function start(){grid=Array.from({length:4},()=>Array(4).fill(0));score=0;won=false;over=false;add();add();render()}
function add(){let e=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!grid[r][c])e.push([r,c]);if(e.length){let [r,c]=e[Math.floor(Math.random()*e.length)];grid[r][c]=Math.random()<.9?2:4}}
function render(){board.innerHTML='';for(let r=0;r<4;r++)for(let c=0;c<4;c++){let cell=document.createElement('div');cell.className='cell';board.appendChild(cell)}
let frag=document.createDocumentFragment();for(let r=0;r<4;r++)for(let c=0;c<4;c++){let v=grid[r][c];if(v){let t=document.createElement('div');t.className='tile t'+v;t.textContent=v;t.style.gridRow=r+1;t.style.gridColumn=c+1;frag.appendChild(t)}}board.appendChild(frag);scoreEl.textContent=score;bestEl.textContent=best;
if(won||over){let o=document.createElement('div');o.className='overlay show';o.innerHTML=`<h2>${won?'You win!':'Game over!'}</h2><button class="btn" onclick="start()">Play Again</button>`;board.appendChild(o)}}
function move(dir){if(won||over)return;let old=JSON.stringify(grid);let lines=[];
for(let i=0;i<4;i++){let a=[];for(let j=0;j<4;j++){let r=dir==='up'?j:dir==='down'?3-j:i,c=dir==='left'?j:dir==='right'?3-j:i;a.push(grid[r][c])}lines.push(a)}
lines=lines.map(a=>{a=a.filter(Boolean);let out=[];for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){out.push(a[i]*2);score+=a[i]*2;i++}else out.push(a[i])}while(out.length<4)out.push(0);return out});
for(let i=0;i<4;i++)for(let j=0;j<4;j++){let r=dir==='up'?j:dir==='down'?3-j:i,c=dir==='left'?j:dir==='right'?3-j:i;grid[r][c]=lines[i][j]}
if(JSON.stringify(grid)!==old){add();if(score>best){best=score;localStorage.best2048=best}if(grid.flat().includes(2048))won=true;if(!canMove())over=true;render()}}
function canMove(){for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!grid[r][c]||(r<3&&grid[r][c]===grid[r+1][c])||(c<3&&grid[r][c]===grid[r][c+1]))return true;return false}
document.addEventListener('keydown',e=>{let m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(m){e.preventDefault();move(m)}})
let sx=0,sy=0;board.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
board.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});
document.getElementById('new').onclick=start;start();
</script>
</body>
</html>
